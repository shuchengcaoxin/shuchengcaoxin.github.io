<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="MetaboCausal, evidence agents part 2. Headline: it refuses the question it cannot read. A Slack exchange in which a garbled disease and a metabolite that is not one are answered with: I could not read a pair out of that. Footer: retrieval first, explanation second.">
  <defs>
    <style>
      .bg   { fill:#f5f6f2 }
      .kick { font-family:Aptos,"Segoe UI",Helvetica,Arial,sans-serif; font-size:23px; font-weight:700;
              letter-spacing:3.4px; fill:#737e78 }
      .head { font-family:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
              font-size:70px; font-weight:700; fill:#17231f; letter-spacing:-1px }
      .ask  { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:23px; fill:#4f5c56 }
      .reply{ font-family:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
              font-size:34px; font-weight:700; fill:#9a5b42 }
      .foot { font-family:Aptos,"Segoe UI",Helvetica,Arial,sans-serif; font-size:25px; font-weight:650;
              fill:#1f5b4d }
      .name { font-family:Aptos,"Segoe UI",Helvetica,Arial,sans-serif; font-size:21px; font-weight:650;
              fill:#737e78 }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect x="0" y="0" width="14" height="630" fill="#1f5b4d"/>

  <text class="kick" x="78" y="86">METABOCAUSAL · EVIDENCE AGENTS, PART 2</text>

  <text class="head" x="78" y="196">It refuses the question</text>
  <text class="head" x="78" y="274">it cannot read.</text>

  <!-- the question -->
  <rect x="78" y="330" width="1044" height="106" rx="12" fill="#e9efea" stroke="#d5dad3"/>
  <text class="name" x="104" y="364">You</text>
  <text class="ask"  x="104" y="400">@MetaboCausal check "cardiovascular Ziweish symdrom"</text>
  <text class="ask"  x="104" y="424">and metabolite "CEA"</text>

  <!-- the answer -->
  <rect x="78" y="456" width="1044" height="88" rx="12" fill="#fffefb" stroke="#9a5b42"/>
  <rect x="78" y="456" width="6" height="88" rx="3" fill="#9a5b42"/>
  <text class="name"  x="104" y="490">MetaboCausal</text>
  <text class="reply" x="104" y="528">I could not read a pair out of that.</text>

  <text class="foot" x="78" y="594">Retrieval first, explanation second.</text>
</svg>
